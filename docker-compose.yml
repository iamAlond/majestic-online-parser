services:
  majestic-online-parser:
    container_name: majestic-online-parser
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=80
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    networks:
      - majestic-online-parser-network
    build:
      context: ./
      dockerfile: Dockerfile
      target: production

networks:
  majestic-online-parser-network:
    name: majestic-parser-net
    driver: bridge
